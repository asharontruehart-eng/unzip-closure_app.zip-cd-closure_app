  <div class="card">
    <h2>What do you need right now?</h2>
    <div class="quick-actions">
      <button class="quick-action" onclick="show('peace')"><strong>🫧 Find calm</strong><span>Grounding and a one-minute reset</span></button>
      <button class="quick-action" onclick="show('reflect')"><strong>📝 Make sense of it</strong><span>Sort what happened from what you needed</span></button>
      <button class="quick-action" onclick="show('release')"><strong>🔥 Let it out</strong><span>A private symbolic release space</span></button>
      <button class="quick-action" onclick="focusPromise()"><strong>🌿 Build self-trust</strong><span>Record one thing you followed through on</span></button>
    </div>
  </div>

  <div class="card">
    <h2>Your progress</h2>
    <div class="stat-grid">
      <div class="stat"><b id="statSteps">0</b><span>steps</span></div>
      <div class="stat"><b id="statPromises">0</b><span>promises</span></div>
      <div class="stat"><b id="statJournals">0</b><span>reflections</span></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track" aria-label="progress toward next plant stage"><div id="progressBar" class="progress-bar"></div></div>
      <p id="progressText" class="muted" style="margin-top:6px;">One gentle step is enough to begin.</p>
    </div>
  </div>

  <div class="card">
    <h2>A Promise to Yourself</h2>
    <p>Build trust with yourself by tracking minor micro-commitments you kept today (e.g., "I drank a glass of water", "I stepped away from the screen").</p>
    <div style="display:flex; gap:8px;">
      <input type="text" id="promise" placeholder="What did you follow through on today?" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-primary); color:var(--text-primary); outline:none;">
      <button class="primary-btn" onclick="completePromise()">Record</button>
    </div>
    <p id="promiseResult" style="color:var(--accent-color); font-size:0.85rem; min-height:1.2rem;"></p>
    <div id="evidenceList"></div>
  </div>

  <div class="card">
    <h2>Affirmation Engine</h2>
    <p id="affirmation" style="font-style:italic; font-size:1.1rem; padding:12px 0; border-left:3px solid var(--accent-color); padding-left:12px;"></p>
    <div class="btn-group">
      <button class="secondary-btn" onclick="newAffirmation()">Next Reflection</button>
      <button class="secondary-btn" onclick="favoriteCurrent()">☀️ Save to Favorites</button>
    </div>
    <div id="favoriteList" style="margin-top:8px;"></div>
  </div>
</div>

<div id="reflect" class="app-screen">
  <div class="card">
    <h2>Structured Closure Builder</h2>
    <p>Deconstruct complex structural shifts into actionable internal realizations.</p>
    
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
      <label>What happened?</label>
      <textarea id="happened" rows="2"></textarea>
      <label>What was I still wishing for?</label>
      <textarea id="wishing" rows="2"></textarea>
      <label>What did I actually need?</label>
      <textarea id="needed" rows="2"></textarea>
      <label>What is safely outside my control?</label>
      <textarea id="control" rows="2"></textarea>
      <label>What can I give myself right now?</label>
      <textarea id="give" rows="2"></textarea>
      <label>What do I want to carry forward?</label>
      <textarea id="forward" rows="2"></textarea>
    </div>
    <div class="btn-group">
      <button class="primary-btn" onclick="saveClosure()">Save Draft</button>
      <button class="secondary-btn" onclick="buildClosure()">Generate Integrated Summary</button>
    </div>
    <p id="closureSaved" style="color:var(--accent-color); font-size:0.85rem;"></p>
    <div id="closureSummary" class="card hidden" style="white-space:pre-wrap; background:var(--accent-light); border-color:var(--accent-color);"></div>
  </div>

  <div class="card">
    <h2>Cognitive Journal Lenses</h2>
    <p>Select a dynamic emotional processing container below to unlock contextual journaling prompts.</p>
    
    <select id="journalLens" onchange="updateJournalPrompts()">
      <option value="unsaid">Things Left Unsaid (Catharsis)</option>
      <option value="loss">Processing Loss & Void Structures</option>
      <option value="patterns">Self-Discovery & Core Behavioral Loops</option>
      <option value="resentment">Releasing Structural Resentment</option>
    </select>

    <div class="pill-cloud" id="promptCloud"></div>
    <textarea id="journalBody" rows="6" placeholder="Your safe private writing room..."></textarea>
    
    <div class="btn-group">
      <button class="primary-btn" onclick="saveJournalEntry()">Log Reflection</button>
    </div>
    <p id="journalStatus" style="color:var(--accent-color); font-size:0.85rem;"></p>
  </div>
</div>

<div id="release" class="app-screen">
  <div class="fire-chamber-wrapper" id="fireChamber">
    <div>
      <h2 style="color: #f7d6c8;">Symbolic Release Chamber</h2>
      <p style="color: #a3897e;">Write down unspoken letters, heavy regrets, or volatile anger. This text runs purely in volatile browser memory. The moment you strike the match, it is permanently purged into nothingness.</p>
    </div>

    <div class="burn-area">
      <textarea id="burnText" class="burn-textarea" placeholder="Unload your raw thoughts here without filter..."></textarea>
      <canvas id="fireCanvas"></canvas>
    </div>

    <div class="btn-group">
      <button class="primary-btn" id="burnTriggerBtn" onclick="igniteLetter()" style="background: var(--fire-color);">Consign Letter to Flames</button>
      <button class="secondary-btn" onclick="clearChamber()" style="color:#a3897e; border-color:#4a2c1f;">Instantly Shred</button>
    </div>
  </div>
</div>

<div id="peace" class="app-screen">
  <div class="card" style="text-align:center;">
    <h2 id="breathTitle">A gentle one-minute reset</h2>
    <p id="breathText">Take a moment to sync your thoughts with physical space.</p>
    <div id="orb" class="stopped"></div>
    <div class="btn-group" style="justify-content:center;">
      <button class="primary-btn" id="breathBtn" onclick="startBreath()">Begin</button>
    </div>
  </div>

  <div class="card">
    <h2>Grounding Checklists</h2>
    <div class="btn-group">
      <button class="secondary-btn" onclick="peaceMode('breath')">4-7-8 Pattern</button>
      <button class="secondary-btn" onclick="peaceMode('ground')">5-4-3-2-1 Sensory</button>
      <button class="secondary-btn" onclick="peaceMode('sense')">Somatic Frameworks</button>
    </div>
    
    <div id="breath" class="hidden" style="margin-top:12px;">
      <p><strong>4-7-8 Breathing Technique:</strong> Inhale silently through the nose for 4 seconds, hold the air steady for 7 seconds, then complete a full audible whoosh exhale for 8 seconds.</p>
    </div>
    <div id="ground" class="hidden" style="margin-top:12px;">
      <p>Look around and note: <strong>5</strong> things you can see, <strong>4</strong> physical surfaces you can touch, <strong>3</strong> unique audio cues you hear, <strong>2</strong> scents you smell, and <strong>1</strong> specific flavor profile you can taste.</p>
    </div>
    <div id="sense" class="hidden" style="margin-top:12px;">
      <p>Drop your shoulders down consciously. Unclench your lower jaw. Soften the tiny muscles directly behind your eyes. Press both heels firmly into the floor beneath you.</p>
    </div>
  </div>
</div>

<div id="history" class="app-screen">
  <div class="card">
    <h2>Your Local Reflection Logs</h2>
    <div id="handledList"></div>
  </div>

  <div class="card">
    <h2>Security & System Backups</h2>
    <p>Manage your sandboxed profile data layers below.</p>
    <div class="btn-group">
      <button class="secondary-btn" onclick="exportData()">Export Data JSON</button>
      <button class="secondary-btn" style="border-color:#b22222; color:#b22222;" onclick="deleteData()">Hard Profile Reset</button>
    </div>
  </div>
</div>
